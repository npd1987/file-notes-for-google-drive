<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File Notes</title>
    <style>
      /* Same palette as the options page — keep the two in step. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --border: #dadce0;
        --field-border: #c4c7c5;
        --card-bg: #f1f3f4;
        --foot-bg: #fafafa;
        --chip-bg: #ffffff;
        --icon-bg: #e8f0fe;
        --accent: #0b57d0;
        --on-accent: #ffffff;
        --ok: #188038;
        --pending: #b06000;
        --error: #d93025;
        --hover: #f1f3f4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f1f;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --border: #3c4043;
          --field-border: #5f6368;
          --card-bg: #2d2e30;
          --foot-bg: #252525;
          --chip-bg: #1f1f1f;
          --icon-bg: #2d3f5f;
          --accent: #a8c7fa;
          --on-accent: #062e6f;
          --ok: #81c995;
          --pending: #fdd663;
          --error: #f28b82;
          --hover: #303134;
        }
      }
      * { box-sizing: border-box; }
      /* Chrome refuses to draw a popup taller than 600px and scrolls the whole
         thing instead, which would put Settings and the footer off the bottom
         edge. So the popup is a column that stops growing at the ceiling, and
         the account list below is the only child allowed to shrink. Nothing
         here hardcodes a number of accounts. */
      html { max-height: 600px; }
      body {
        width: 300px;
        margin: 0;
        font: 13px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        max-height: 600px;
      }
      body > * { flex: none; }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
      }
      header img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--icon-bg);
        padding: 3px;
      }
      .titles { flex: 1; min-width: 0; }
      .titles b { display: block; font-size: 14px; font-weight: 500; }
      .titles span, #version { font-size: 11px; color: var(--muted); }

      #statusRow {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 16px 12px;
        font-size: 12px;
      }
      #dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      #statusRow.ok #dot { background: var(--ok); }
      #statusRow.ok #statusText { color: var(--ok); }
      #statusRow.pending #dot { background: var(--pending); }
      #statusRow.pending #statusText { color: var(--pending); }
      #statusRow.error #dot { background: var(--error); }
      #statusRow.error #statusText { color: var(--error); }
      #account {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #hint {
        margin: 0 16px 14px;
        padding: 12px;
        background: var(--card-bg);
        border-radius: 8px;
      }
      kbd {
        display: inline-block;
        padding: 1px 6px;
        background: var(--chip-bg);
        border: 1px solid var(--field-border);
        border-radius: 4px;
        font: inherit;
        font-size: 12px;
      }

      /* The account picker. Only rendered when a second account is connected —
         with one there is nothing to choose, and the popup stays as it was. */
      #pickerLabel {
        padding: 0 16px 6px;
        font-size: 11px;
        color: var(--muted);
      }
      #accountList {
        margin: 0 16px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        /* Grows with the list; shrinks and scrolls only at the ceiling. */
        flex: 0 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* A button so it is reachable by keyboard, restyled off the pill above. */
      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        flex: none;
        padding: 9px 10px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        color: var(--fg);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .account:last-child { border-bottom: 0; }
      .account:hover { background: var(--hover); }
      .account:hover .go { color: var(--accent); }
      .account:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
        color: #ffffff;
      }
      .who { flex: 1; min-width: 0; }
      /* Addresses can be longer than the popup is wide; truncate rather than
         wrap, so every row stays the same height. */
      .who .email {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .who .slot { display: block; font-size: 11px; color: var(--muted); }
      .go { flex: none; color: var(--muted); font-size: 14px; }

      .actions { display: flex; gap: 8px; padding: 0 16px 14px; }
      button {
        flex: 1;
        padding: 8px 0;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border-color: var(--field-border);
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      footer {
        display: flex;
        gap: 14px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        background: var(--foot-bg);
      }
      footer a { font-size: 11px; color: var(--accent); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
      footer a.last { margin-left: auto; }
      footer:empty { display: none; }
    </style>
  </head>
  <body>
    <header>
      <img src="../../icons/icon32.png" alt="" />
      <div class="titles">
        <b>File notes</b>
        <span>for Google Drive</span>
      </div>
      <span id="version"></span>
    </header>

    <div id="statusRow">
      <span id="dot"></span>
      <span id="statusText">Checking…</span>
      <span id="account"></span>
    </div>

    <p id="hint">Loading…</p>

    <div id="pickerLabel" hidden>Open Drive as</div>
    <div id="accountList" hidden></div>

    <div class="actions">
      <button id="primary">Open Drive</button>
      <button id="settings" class="secondary">Settings</button>
    </div>

    <footer id="links"></footer>

    <script src="popup.js"></script>
  </body>
</html>
