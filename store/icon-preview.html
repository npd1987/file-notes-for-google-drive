<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icon design preview</title>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        background: #fff;
        color: #1f1f1f;
        padding: 30px;
        margin: 0;
      }
      h1 { font-size: 18px; margin: 0 0 20px; }
      .grid { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-start; }
      .cell { text-align: center; }
      .cell p { margin: 8px 0 0; font-size: 12px; color: #5f6368; }
      .small { display: flex; gap: 10px; align-items: flex-end; justify-content: center; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Static preview of the four styles (128px), plus small-size fallback</h1>
    <div class="grid">
      <!-- Style A: mockup + wordmark -->
      <div class="cell">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="27" fill="#0b57d0" />
          <g fill="#fff">
            <rect x="18" y="14" width="13" height="15" rx="2.5" opacity=".95" />
            <rect x="37" y="18" width="73" height="7" rx="3.5" opacity=".95" />
            <rect x="18" y="34" width="13" height="15" rx="2.5" opacity=".55" />
            <rect x="37" y="38" width="73" height="7" rx="3.5" opacity=".55" />
          </g>
          <rect x="26" y="50" width="82" height="44" rx="7" fill="#000" opacity=".25" transform="translate(0,3)" />
          <rect x="26" y="50" width="82" height="44" rx="7" fill="#fff" />
          <g fill="#0b57d0">
            <rect x="35" y="60" width="49" height="6" rx="3" />
            <rect x="35" y="72" width="49" height="6" rx="3" />
            <rect x="35" y="84" width="27" height="6" rx="3" />
          </g>
          <text x="64" y="116" text-anchor="middle" font-family="system-ui, sans-serif"
                font-size="15" font-weight="700" fill="#fff" letter-spacing="1">FILE NOTES</text>
        </svg>
        <p>A — Mockup + wordmark</p>
      </div>

      <!-- Style B: mockup only -->
      <div class="cell">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="27" fill="#0b57d0" />
          <g fill="#fff">
            <rect x="18" y="20" width="13" height="15" rx="2.5" opacity=".95" />
            <rect x="37" y="24" width="73" height="7" rx="3.5" opacity=".95" />
            <rect x="18" y="40" width="13" height="15" rx="2.5" opacity=".55" />
            <rect x="37" y="44" width="73" height="7" rx="3.5" opacity=".55" />
          </g>
          <rect x="26" y="60" width="82" height="50" rx="8" fill="#000" opacity=".25" transform="translate(0,3)" />
          <rect x="26" y="60" width="82" height="50" rx="8" fill="#fff" />
          <g fill="#0b57d0">
            <rect x="35" y="70" width="49" height="6" rx="3" />
            <rect x="35" y="82" width="49" height="6" rx="3" />
            <rect x="35" y="94" width="27" height="6" rx="3" />
          </g>
        </svg>
        <p>B — Mockup only</p>
      </div>

      <!-- Style C: card + FN -->
      <div class="cell">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="27" fill="#0b57d0" />
          <g fill="#fff">
            <rect x="18" y="16" width="13" height="15" rx="2.5" opacity=".95" />
            <rect x="37" y="20" width="73" height="7" rx="3.5" opacity=".95" />
            <rect x="18" y="36" width="13" height="15" rx="2.5" opacity=".55" />
            <rect x="37" y="40" width="73" height="7" rx="3.5" opacity=".55" />
          </g>
          <rect x="26" y="58" width="76" height="50" rx="8" fill="#000" opacity=".25" transform="translate(0,3)" />
          <rect x="26" y="58" width="76" height="50" rx="8" fill="#fff" />
          <text x="64" y="94" text-anchor="middle" font-family="system-ui, sans-serif"
                font-size="30" font-weight="700" fill="#0b57d0">FN</text>
        </svg>
        <p>C — Note card + FN</p>
      </div>

      <!-- Style D: monogram -->
      <div class="cell">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="27" fill="#0b57d0" />
          <text x="64" y="88" text-anchor="middle" font-family="system-ui, sans-serif"
                font-size="62" font-weight="700" fill="#fff">FN</text>
        </svg>
        <p>D — FN monogram<br />(also used at 16 &amp; 32px)</p>
      </div>
    </div>

    <div class="small">
      <svg width="48" height="48" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="27" fill="#0b57d0" />
        <g fill="#fff">
          <rect x="18" y="20" width="13" height="15" rx="2.5" opacity=".95" />
          <rect x="37" y="24" width="73" height="7" rx="3.5" opacity=".95" />
          <rect x="18" y="40" width="13" height="15" rx="2.5" opacity=".55" />
          <rect x="37" y="44" width="73" height="7" rx="3.5" opacity=".55" />
        </g>
        <rect x="26" y="60" width="82" height="50" rx="8" fill="#fff" />
        <g fill="#0b57d0">
          <rect x="35" y="70" width="49" height="6" rx="3" />
          <rect x="35" y="82" width="49" height="6" rx="3" />
          <rect x="35" y="94" width="27" height="6" rx="3" />
        </g>
      </svg>
      <svg width="32" height="32" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="27" fill="#0b57d0" />
        <text x="64" y="88" text-anchor="middle" font-family="system-ui, sans-serif"
              font-size="62" font-weight="700" fill="#fff">FN</text>
      </svg>
      <svg width="16" height="16" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="27" fill="#0b57d0" />
        <text x="64" y="88" text-anchor="middle" font-family="system-ui, sans-serif"
              font-size="62" font-weight="700" fill="#fff">FN</text>
      </svg>
    </div>
  </body>
</html>
